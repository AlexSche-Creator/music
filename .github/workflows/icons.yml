name: Build PWA icons

# Auto-regenerates the four PNG icons (icon-192, icon-512, icon-maskable-512,
# apple-touch-icon) from icons/generate.py whenever the generator or the source
# SVG changes — or whenever a branch is pushed without the PNGs yet. The action
# commits the PNGs back to the branch that triggered it.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a token that can push back to the branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Generate icons
        run: python3 icons/generate.py

      - name: Commit and push icons if changed
        run: |
          if [[ -n "$(git status --porcelain icons/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add icons/*.png
            git commit -m "Build PWA icons via Pillow [skip ci]"
            git push
          else
            echo "icons unchanged"
          fi
