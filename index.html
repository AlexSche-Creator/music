<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Тренажёр" />
  <meta name="description" content="Личный музыкальный тренажёр: ступени, аккорды, чувства. A minor и C major." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Музыкальный тренажёр</title>
</head>
<body>
  <header class="top-bar">
    <button class="logo" data-route="#/dashboard" aria-label="На главную">
      <span class="logo-dot"></span>
      <span class="logo-text">Тренажёр</span>
    </button>
    <div class="streak-pill" id="streakPill" hidden>
      <span class="streak-flame">●</span><span id="streakValue">0</span>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tab-bar" aria-label="Разделы">
    <a class="tab" data-route="#/dashboard"><span>Главная</span></a>
    <a class="tab" data-route="#/stats"><span>Статистика</span></a>
    <a class="tab" data-route="#/settings"><span>Настройки</span></a>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
